<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c72bd">
<title>Offline · Spendly</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
         background: linear-gradient(180deg, #1c72bd, #217ccc); color: #101a2b;
         font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { width: 100%; max-width: 340px; background: #fff; border-radius: 8px; padding: 32px 24px; }
  .icon { font-size: 40px; }
  h1 { font-size: 22px; margin: 8px 0 6px; }
  p { color: #556070; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; padding: 12px 22px; border: 0; border-radius: 8px; background: #1f7fd1; color: #fff; cursor: pointer; }
  button:focus-visible { outline: 2px solid #1f7fd1; outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">&#128245;</div>
    <h1>You are offline</h1>
    <p>Spendly needs the internet to show your expenses. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
