<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Spendly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%20fill%3D%27none%27%20stroke%3D%27%231f7fd1%27%20stroke-width%3D%272.6%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpath%20d%3D%27M44%2033V22a8%208%200%200%200-8-8H18a8%208%200%200%200-8%208v20a8%208%200%200%200%208%208h15%27%2F%3E%3Cpath%20d%3D%27M19%2014l2-7h12l2%207M20.5%2010.5h13%27%2F%3E%3Cpath%20d%3D%27M19%2050l2%207h9%27%2F%3E%3Cpath%20d%3D%27M30.6%2025.8c0-1.6-1.6-2.6-3.6-2.6s-3.6%201-3.6%202.7c0%203.7%207.2%201.9%207.2%205.6%200%201.7-1.6%202.8-3.6%202.8s-3.6-1.1-3.6-2.8M27%2020.5v2.7M27%2034.3V37%27%2F%3E%3Crect%20x%3D%2734%27%20y%3D%2733%27%20width%3D%2722%27%20height%3D%2719%27%20rx%3D%273.2%27%2F%3E%3Cpath%20d%3D%27M34%2041h22%27%2F%3E%3Cpath%20d%3D%27M39.5%2052v3.5M50.5%2052v3.5%27%2F%3E%3Ccircle%20cx%3D%2740%27%20cy%3D%2746.3%27%20r%3D%271.5%27%20fill%3D%27%231f7fd1%27%20stroke%3D%27none%27%2F%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2746.3%27%20r%3D%271.5%27%20fill%3D%27%231f7fd1%27%20stroke%3D%27none%27%2F%3E%3C%2Fsvg%3E">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: linear-gradient(180deg, #1c72bd, #217ccc); color: #101a2b;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .card { width: 100%; max-width: 360px; background: #fff; border-radius: 8px; padding: 32px 28px; }
  .logo { width: 56px; height: 56px; color: #1f7fd1; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p { color: #6b7686; font-size: 14px; margin: 0 0 20px; }
  input { font: inherit; width: 100%; padding: 12px; border: 1px solid #cfd8e3; border-radius: 8px; }
  input:focus-visible, button:focus-visible { outline: 2px solid #1f7fd1; outline-offset: 2px; }
  button {
    font: inherit; font-weight: 600; width: 100%; margin-top: 12px; padding: 12px; border: 0;
    border-radius: 8px; background: #1f7fd1; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: #d9485f; font-size: 13px; min-height: 18px; margin: 10px 0 0; }
</style>
</head>
<body>
  <main class="card">
    <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Spendly logo"><path d="M44 33V22a8 8 0 0 0-8-8H18a8 8 0 0 0-8 8v20a8 8 0 0 0 8 8h15"/><path d="M19 14l2-7h12l2 7M20.5 10.5h13"/><path d="M19 50l2 7h9"/><path d="M30.6 25.8c0-1.6-1.6-2.6-3.6-2.6s-3.6 1-3.6 2.7c0 3.7 7.2 1.9 7.2 5.6 0 1.7-1.6 2.8-3.6 2.8s-3.6-1.1-3.6-2.8M27 20.5v2.7M27 34.3V37"/><rect x="34" y="33" width="22" height="19" rx="3.2"/><path d="M34 41h22"/><path d="M39.5 52v3.5M50.5 52v3.5"/><circle cx="40" cy="46.3" r="1.5" fill="currentColor" stroke="none"/><circle cx="50" cy="46.3" r="1.5" fill="currentColor" stroke="none"/></svg>
    <h1>Spendly</h1>
    <p>Enter your password to continue.</p>
    <form id="form">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
      <button id="btn" type="submit">Log in</button>
    </form>
    <p class="err" id="err" role="alert"></p>
  </main>
<script>
  document.getElementById("form").onsubmit = async ev => {
    ev.preventDefault();
    const err = document.getElementById("err"), btn = document.getElementById("btn");
    err.textContent = ""; btn.disabled = true;
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("pw").value })
      });
      if (res.ok) { location.href = "/"; return; }
      const data = await res.json().catch(() => ({}));
      err.textContent = typeof data.detail === "string" ? data.detail : "Could not log in.";
    } catch (e) {
      err.textContent = "Could not reach the server.";
    }
    btn.disabled = false;
  };
</script>
</body>
</html>
