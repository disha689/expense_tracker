<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Expense Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: linear-gradient(180deg, #2b8ad6, #3a99e0); color: #101a2b;
    font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  }
  .card { width: 100%; max-width: 360px; background: #fff; border-radius: 12px; padding: 32px 28px; }
  .icon { font-size: 36px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p { color: #6b7686; font-size: 14px; margin: 0 0 20px; }
  input { font: inherit; width: 100%; padding: 12px; border: 1px solid #cfd8e3; border-radius: 12px; }
  input:focus-visible, button:focus-visible { outline: 2px solid #1f7fd1; outline-offset: 2px; }
  button {
    font: inherit; font-weight: 600; width: 100%; margin-top: 12px; padding: 12px; border: 0;
    border-radius: 12px; background: #1f7fd1; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: #d9485f; font-size: 13px; min-height: 18px; margin: 10px 0 0; }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">&#128274;</div>
    <h1>Expense Tracker</h1>
    <p>Enter your password to continue.</p>
    <form id="form">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
      <button id="btn" type="submit">Log in</button>
    </form>
    <p class="err" id="err" role="alert"></p>
  </main>
<script>
  document.getElementById("form").onsubmit = async ev => {
    ev.preventDefault();
    const err = document.getElementById("err"), btn = document.getElementById("btn");
    err.textContent = ""; btn.disabled = true;
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("pw").value })
      });
      if (res.ok) { location.href = "/"; return; }
      const data = await res.json().catch(() => ({}));
      err.textContent = typeof data.detail === "string" ? data.detail : "Could not log in.";
    } catch (e) {
      err.textContent = "Could not reach the server.";
    }
    btn.disabled = false;
  };
</script>
</body>
</html>
